name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'NOTICE', 'LICENSE']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image does not carry every platform: android-37 and build-tools 36 we deliver
      # ourselves, otherwise the build would go and download them in the middle of the job.
      # The package is called android-37.0: from 36 on, the minor version is part of the name. The
      # old name is left as a fallback, and if neither is found, the job prints the list of
      # available platforms.
      - name: Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" \
            || "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" \
            || {
              echo "::error::android-37 is not available in the SDK repository"
              "$SDKMANAGER" --list | grep -E "platforms;android-3[0-9]" || true
              exit 1
            }

      - name: Unit tests
        run: ./gradlew testGithubDebugUnitTest

      - name: Debug build
        run: ./gradlew assembleGithubDebug

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: app/build/reports/tests/

      - name: APK
        uses: actions/upload-artifact@v5
        with:
          name: pourista-debug-apk
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error
